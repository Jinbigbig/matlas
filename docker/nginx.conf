server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/html text/css text/javascript application/javascript application/json application/xml text/xml text/plain image/svg+xml;
    gzip_min_length 512;
    gzip_vary on;

    # 静态资源（队徽/JS/CSS）长缓存：Cloudflare 边缘可直接命中，不必每次
    # 回源走跨境隧道。首页 61 张队徽是打开慢的主因，缓存后二次访问秒开。
    location /assets/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
        try_files $uri =404;
    }

    # 接口必须实时，禁止任何缓存。
    location /api/ {
        add_header Cache-Control "no-store" always;
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }

    # HTML 骨架不缓存，实时部分由前端 /api 拉取替换。
    location / {
        add_header Cache-Control "no-store" always;
        try_files $uri $uri/ /index.html;
    }
}
