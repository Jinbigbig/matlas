  var hits = DATA.filter(function (r) {
    return r.some(function (v, i) { return i !== 5 && String(v).toLowerCase().indexOf(kw) !== -1; });
  }).slice(0, 50);
  meta.textContent = "共 " + hits.length + " 场匹配（最多显示 50 条）";
  if (!hits.length) { box.innerHTML = '<p class="sub">没有匹配的赛事，换个关键字试试。</p>'; return; }
  box.innerHTML = hits.map(function (r) {
    return '<a class="match-card" href="' + "matches/" + r[5] + '.html">'
      + '<div class="mc-header"><div class="mc-meta"><span class="date">' + r[0].slice(5).replace("-", "/")
      + '</span><span class="league">' + r[2] + '</span><span class="num">' + r[1] + '</span></div></div>'
      + '<div class="mc-body"><div class="mc-teams"><div class="mc-team"><span>' + r[3]
      + '</span></div><div class="mc-score"><div class="vs">VS</div></div><div class="mc-team"><span>' + r[4]
      + "</span></div></div></div></a>";
  }).join("");
})();
</script>

<script>
(function () {
  var btn = document.getElementById("back-top");
  if (!btn) return;
  var sync = function () {
    btn.classList.toggle("show", window.scrollY > 480);
  };
  window.addEventListener("scroll", sync, { passive: true });
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  sync();
})();
// data-goto 事件委托：联赛/球队内链在整卡 <a> 内部（HTML 不允许嵌套 a），
// 点击时阻止整卡默认跳转，改跳联赛/球队专题页。
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-goto]");
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  window.location.href = t.getAttribute("data-goto");
});
// 日历日期选择（input[type=date]）：无数据的日期自动吸附到最近的有数据日期
function snapDate(arr, v) {
  if (arr.indexOf(v) >= 0) return v;
  var prev = null, next = null;
  arr.forEach(function (d) {
    if (d < v && (prev === null || d > prev)) prev = d;
    if (d > v && (next === null || d < next)) next = d;
  });
  return prev || next || v;
}
document.addEventListener("change", function (e) {
  var c = e.target.closest(".date-cal");
  if (!c || !c.value) return;
  var dattr = c.getAttribute("data-dates");
  if (!dattr) return;
  var dates = JSON.parse(dattr);
  var t = snapDate(dates, c.value);
  c.value = t;
  var mode = c.getAttribute("data-mode");
  if (mode === "jump") {
    window.location.href = (c.getAttribute("data-pre") || "") + "days/" + t + ".html";
  } else if (mode === "ai") {
    var r = document.getElementById("aid-" + dates.indexOf(t));
    if (r) r.checked = true;
    aiSyncArrows();
  } else if (mode === "odds") {
    if (window.renderOddsDay) window.renderOddsDay(t);
  }
  // mode === "bets"：仅存值，点「加载比赛」时读取
});
// AI 预测卡 ‹› 箭头：基于隐藏 radio 序号步进，内容显隐仍走纯 CSS 规则
function aiSyncArrows() {
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  if (!radios.length) return;
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  document.querySelectorAll("[data-aid-step]").forEach(function (a) {
    var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
    a.classList.toggle("off", i < 0 || i >= radios.length);
  });
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-aid-step]");
  if (!a) return;
  e.preventDefault();
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
  if (i >= 0 && i < radios.length) radios[i].checked = true;
  aiSyncArrows();
});
document.addEventListener("change", function (e) {
  if (e.target && e.target.name === "aid") aiSyncArrows();
});
aiSyncArrows();
</script>
