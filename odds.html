  var out = document.getElementById("odds-out");
  var loading = {};
  if (!DATA.dates.length) { out.innerHTML = '<p class="sub">暂无盘口数据。</p>'; return; }
  function pill(lab, val, hit, cls) {
    if (val === undefined || val === null || val === "") return "";
    return '<span class="odds-pill' + (hit ? " hit" : "") + '"><b class="' + (cls || "") + '">'
      + lab + "</b><i>" + val + "</i></span>";
  }
  function sec(title, inner) {
    if (!inner) return "";
    return '<div class="odds-sec"><div class="odds-sec-t">' + title + '</div><div class="odds-pills">' + inner + "</div></div>";
  }
  function render(d) {
    var rows = DATA.rows.filter(function (r) { return r.d === d; });
    if (!rows.length && !loading[d] && window.fetch) {
      loading[d] = true;
      out.innerHTML = '<p class="sub">加载中…</p>';
      fetch("data/odds/" + d + ".json").then(function (resp) { return resp.json(); })
        .then(function (list) {
          if (!list || !list.length) {
            loading[d] = false;
            out.innerHTML = '<p class="sub">暂无盘口数据。</p>';
            return;
          }
          list.forEach(function (x) { DATA.rows.push(x); });
          loading[d] = false;
          render(d);
        })
        .catch(function () { loading[d] = false; out.innerHTML = '<p class="sub">暂无盘口数据。</p>'; });
      return;
    }
    var html = "";
    rows.forEach(function (r) {
      var of = r.of, done = r.gh !== null && r.gh !== undefined;
      var head = '<div class="odds-m-head">'
        + (r.c ? '<span class="odds-code">' + r.c + "</span>" : "")
        + (r.tm ? '<span class="odds-time">' + r.tm + "</span>" : "")
        + (r.lg ? '<span class="odds-lg">' + r.lg + "</span>" : "")
        + '<span class="odds-vs"><a href="matches/' + r.id + '.html"><b>' + r.h + "</b><i>VS</i><b>" + r.a + "</b></a></span>"
        + (done ? '<span class="odds-res">赛果 ' + r.gh + "-" + r.ga
          + (r.hh !== null && r.hh !== undefined ? " (半 " + r.hh + "-" + r.ha + ")" : "") + "</span>" : "")
        + "</div>";
      // 胜平负
      var w = done ? (r.gh > r.ga ? "胜" : r.gh < r.ga ? "负" : "平") : null;
      var s = pill("胜", of.spf && of.spf["胜"], w === "胜", "s-h")
        + pill("平", of.spf && of.spf["平"], w === "平", "s-d")
        + pill("负", of.spf && of.spf["负"], w === "负", "s-a");
      html += '<section class="odds-match">' + head + sec("胜平负", s);
      // 让球（多行；走水行不高亮）
      var rq = "";
      (of.rq || []).forEach(function (row) {
        var line = parseFloat(row.handicap), rw = null;
        if (done && line === line) {
          var adj = r.gh + line;
          rw = adj > r.ga ? "胜" : adj < r.ga ? "负" : "平";
        }
        rq += '<span class="rq-tag">让球' + row.handicap + "</span>"
          + pill("胜", row["胜"], rw === "胜", "s-h")
          + pill("平", row["平"], rw === "平", "s-d")
          + pill("负", row["负"], rw === "负", "s-a");
      });
      html += sec("让球", rq);
      // 比分：胜比分 / 平比分 / 负比分 三组分行（网易布局）
      function scoreGroup(k) {
        var mm = k.match(/^(\d+):(\d+)$/);
        if (mm) { var x = +mm[1], y = +mm[2]; return x > y ? "h" : x < y ? "a" : "d"; }
        return k.indexOf("胜") >= 0 ? "h" : k.indexOf("平") >= 0 ? "d" : k.indexOf("负") >= 0 ? "a" : "d";
      }
      var scG = {h: [], d: [], a: []};
      Object.keys(of.score || {}).forEach(function (k) {
        if (of.score[k]) scG[scoreGroup(k)].push(k);
      });
      var scT = {h: "胜比分", d: "平比分", a: "负比分"};
      ["h", "d", "a"].forEach(function (gk) {
        var s = "";
        scG[gk].forEach(function (k) {
          var v = of.score[k], hit = false, cls = gk === "h" ? "s-h" : gk === "a" ? "s-a" : "s-d";

  };

<script>
(function () {
  var btn = document.getElementById("back-top");
  if (!btn) return;
  var sync = function () {
    btn.classList.toggle("show", window.scrollY > 480);
  };
  window.addEventListener("scroll", sync, { passive: true });
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  sync();
})();
// data-goto 事件委托：联赛/球队内链在整卡 <a> 内部（HTML 不允许嵌套 a），
// 点击时阻止整卡默认跳转，改跳联赛/球队专题页。
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-goto]");
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  window.location.href = t.getAttribute("data-goto");
});
// 日历日期选择（input[type=date]）：无数据的日期自动吸附到最近的有数据日期
function snapDate(arr, v) {
  if (arr.indexOf(v) >= 0) return v;
  var prev = null, next = null;
  arr.forEach(function (d) {
    if (d < v && (prev === null || d > prev)) prev = d;
    if (d > v && (next === null || d < next)) next = d;
  });
  return prev || next || v;
}
document.addEventListener("change", function (e) {
  var c = e.target.closest(".date-cal");
  if (!c || !c.value) return;
  var dattr = c.getAttribute("data-dates");
  if (!dattr) return;
  var dates = JSON.parse(dattr);
  var t = snapDate(dates, c.value);
  c.value = t;
  var mode = c.getAttribute("data-mode");
  if (mode === "jump") {
    window.location.href = (c.getAttribute("data-pre") || "") + "days/" + t + ".html";
  } else if (mode === "ai") {
    var r = document.getElementById("aid-" + dates.indexOf(t));
    if (r) r.checked = true;
    aiSyncArrows();
  } else if (mode === "odds") {
    if (window.renderOddsDay) window.renderOddsDay(t);
  }
  // mode === "bets"：仅存值，点「加载比赛」时读取
});
// AI 预测卡 ‹› 箭头：基于隐藏 radio 序号步进，内容显隐仍走纯 CSS 规则
function aiSyncArrows() {
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  if (!radios.length) return;
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  document.querySelectorAll("[data-aid-step]").forEach(function (a) {
    var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
    a.classList.toggle("off", i < 0 || i >= radios.length);
  });
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-aid-step]");
  if (!a) return;
  e.preventDefault();
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
  if (i >= 0 && i < radios.length) radios[i].checked = true;
  aiSyncArrows();
});
document.addEventListener("change", function (e) {
  if (e.target && e.target.name === "aid") aiSyncArrows();
});
aiSyncArrows();
</script>
<script>

// ===== 实时数据：多源择新 =====
window.LIVE_MODE = "remote";
(function () {
  if (window.LIVE_MODE === "off") return;
  var HOST = location.hostname;
  var LOCAL = HOST === "127.0.0.1" || HOST === "localhost";
  var ROOT = "";                                  // 站点根相对前缀，构建期注入
  var CF = LOCAL ? "" : "https://www.matlas.top";
  var GH = "https://jinbigbig.github.io/matlas";
  var ON_GH = HOST === "jinbigbig.github.io";
  function stamp() { return Date.now(); }
  // 源①：同域静态快照
  function staticUrl(date, light) {
    return ROOT + "data/live/" + (light ? "light-" : "") + date + ".json?v=" + stamp();
  }
  // 源②：CF 边缘接口（KV 优先，KV 落后时内部回落 CF 静态快照）
  function apiUrl(date, light) {
    return CF + "/api/live?date=" + date + (light ? "&light=1" : "") + "&v=" + stamp();
  }
  // 源③：GitHub Pages 静态（跨域，仅两源皆空时用）
  function ghUrl(date, light) {
    return GH + "/data/live/" + (light ? "light-" : "") + date + ".json?v=" + stamp();
  }
  // 实时请求：8 秒超时 + 全局并发上限 9（三源×多天）+ 页面隐藏时静默跳过。
  // 慢链路下若无超时，挂起的请求会占满浏览器对同域的连接，导致点击后整页长时间转圈。
  var _pending = 0, _PMAX = 9, _fail = 0;
  function getJson(u) {
    if (document.hidden || _pending >= _PMAX) return Promise.resolve(null);
    _pending++;
    var ctl = window.AbortController ? new AbortController() : null;
    var opt = { cache: "no-store" };
    if (ctl) opt.signal = ctl.signal;
    var timer = ctl ? setTimeout(function () { try { ctl.abort(); } catch (e) {} }, 8000) : null;
    function done() {
      if (timer) clearTimeout(timer);
      timer = null;
      _pending = Math.max(0, _pending - 1);
    }
    return fetch(u, opt)
      .then(function (r) { if (r.ok) { _fail = 0; } else { _fail++; } return r.ok ? r.json() : null; })
      .then(function (v) { done(); return v; }, function () { _fail++; done(); return null; });
  }
  // 多源择新：并发取同域静态与 CF 接口，按 updated 取较晚的一份。
  function pickNewest(list) {
    var best = null;
    for (var i = 0; i < list.length; i++) {
      var v = list[i];
      if (!v || !v.matches) continue;
      if (!best || String(v.updated || "") > String(best.updated || "")) best = v;
    }
    return best;
  }
  // 同一页面会话内记住已拿到的最新一份。CF 接口偶发超时时，
  // 不让落后的同域静态快照把页面上的新分钟覆盖回去。
  var _lastGood = {};
  function fetchLive(date, light) {
    var key = date + (light ? "|l" : "|f");
    var urls = [staticUrl(date, light)];
    if (!LOCAL) {
      urls.push(apiUrl(date, light));
      // CF 站把 GH 静态纳入并发择新：KV 挂掉时仍能读到唯一那份快照。
      // GH 站的 staticUrl 本身就是同域 GH 静态，无需重复跨域请求。
      if (!ON_GH) urls.push(ghUrl(date, light));
    }
    return Promise.all(urls.map(getJson)).then(function (list) {
      var best = pickNewest(list);
      var prev = _lastGood[key];
      if (best) {
        if (prev && String(best.updated || "") < String(prev.updated || "")) best = prev;
        else _lastGood[key] = best;
        _fail = 0;
        return best;
      }
      if (prev) return prev;
      return null;
    });
  }
  // 轮询节拍：首次延迟 1.5s 让首屏资源先加载；正常 60s 一次，连续失败 3 次后降到 5 分钟。
  function loop(fn) {
    function tick() {
      fn();
      setTimeout(tick, _fail >= 3 ? 300000 : 60000);
    }
    setTimeout(tick, 1500);
  }
  function nameHit(a, b) {
    a = (a || "").trim(); b = (b || "").trim();
    return a.length >= 2 && b.length >= 2 && (a.indexOf(b) >= 0 || b.indexOf(a) >= 0);
  }

  // 赔率页 / 投注页：全玩法赔率实时替换（页面暴露 window.updateOddsFull）
  if (typeof window.updateOddsFull === "function") {
    var ofDates = {}, ofCal = document.querySelector("#odds-dates, .nb-topbar .date-cal");
    var ofDate = (ofCal && ofCal.value) || "";
    if (ofDate) ofDates[ofDate] = 1;
    // 同时拉明天（在售盘口跨日），保证日历切换后也有数据
    var ofTomorrow = new Date(ofDate + "T00:00:00");
    if (!isNaN(ofTomorrow.getTime())) {
      ofTomorrow.setDate(ofTomorrow.getDate() + 1);
      var tStr = ofTomorrow.toISOString().slice(0, 10);
      if (tStr !== ofDate) ofDates[tStr] = 1;
    }
    function pollOddsFull() {
      var pending = Object.keys(ofDates).length;
      if (!pending) return;
      Object.keys(ofDates).forEach(function (d) {
        fetchLive(d, true).then(function (res) {
          pending--;
          if (!res || !res.matches) return;
          var map = {};
          res.matches.forEach(function (m) {
            if (m.odds_full) map[m.match_id] = m.odds_full;
          });
          if (Object.keys(map).length) window.updateOddsFull(map);
        });
      });
    }
    loop(pollOddsFull);
    return;
  }

  // 单场详情：比分 + 赔率曲线
  var card = document.querySelector("[data-live-match]");
  if (card) {
    var mid = card.getAttribute("data-live-match");
    var date = mid.slice(0, 10);
    function pollSingle() {
      fetchLive(date, false).then(function (d) {
        if (!d) return;
        var m = null, ms = d.matches || [];
        if (d.match && d.match.match_id === mid) m = d.match;
        else for (var i = 0; i < ms.length; i++) if (ms[i].match_id === mid) { m = ms[i]; break; }
        if (!m) return;
        var sc = card.querySelector("[data-live='score']");
        if (sc && m.score) {
          sc.innerHTML = '<div class="main">' + m.score + '</div>'
            + (m.half ? '<div class="sub">(' + m.half + ')</div>' : '');
        }
        var tr = card.querySelector("[data-live='trend']");
        if (tr && m.trend_html) tr.outerHTML = m.trend_html;
      });
    }
    loop(pollSingle);
    return;
  }

  // 首页/归档/联赛/球队卡片：比分实时替换（data-live-card = match_id）
  var cards = [].slice.call(document.querySelectorAll("[data-live-card]"));
  if (cards.length) {
    var cardDates = {};
    cards.forEach(function (c) {
      var mid = c.getAttribute("data-live-card") || "";
      var d = mid.slice(0, 10);
      if (d.length === 10) (cardDates[d] = cardDates[d] || []).push(c);
    });
    function applyCard(c, m) {
      var sc = c.querySelector("[data-live='score']");
      if (sc && m.score) {
        sc.innerHTML = '<div class="main">' + m.score + '</div>'
          + (m.half ? '<div class="sub">(' + m.half + ')</div>' : '');
      }
      var badge = c.querySelector("[data-live='status']");
      if (badge && m.status) {
        var live = m.status === "进行中";
        badge.textContent = live ? (m.minute ? m.minute + "'" : "进行中") : m.status;
        badge.className = "mc-live" + (live ? " live" : "");
        badge.hidden = false;
      }
      // 命中印章：赛果一结束就按「预测方向 vs 实际比分」现算，不等重建页面。
      var st = c.querySelector("[data-live='stamp']");
      if (st && m.status === "已结束" && m.score) {
        var want = { "主胜": "H", "平": "D", "客胜": "A" }[st.getAttribute("data-pick")];
        var g = String(m.score).match(/(\d+)\s*[-:：]\s*(\d+)/);
        if (want && g) {
          var gf = Number(g[1]) > Number(g[2]) ? "H" : (Number(g[1]) < Number(g[2]) ? "A" : "D");
          var hit = want === gf;
          st.className = "prediction-stamp " + (hit ? "stamp-red" : "stamp-black");
          st.textContent = hit ? "✔" : "✘";
          st.hidden = false;
        }
      }
    }
    function pollCards() {
      Object.keys(cardDates).forEach(function (d) {
        fetchLive(d, true).then(function (res) {
          if (!res || !res.matches) return;
          var map = {};
          res.matches.forEach(function (m) { map[m.match_id] = m; });
          cardDates[d].forEach(function (c) {
            var m = map[c.getAttribute("data-live-card")];
            if (m) applyCard(c, m);
          });
        });
      });
    }
    loop(pollCards);
    return;
  }

  // 比赛列表：按日期聚合，比分 / 状态替换；已结算行不动。
  var rows = [].slice.call(document.querySelectorAll("[data-live-row]"));
  if (!rows.length) return;
  var byDate = {};
  rows.forEach(function (row) {
    var st = row.querySelector(".ml-st");
    if (st && (st.classList.contains("win") || st.classList.contains("lose"))) return;
    var d = row.getAttribute("data-live-date");
    if (d) (byDate[d] = byDate[d] || []).push(row);
  });
  function findMatch(list, row) {
    var key = row.getAttribute("data-live-row") || "";
    for (var i = 0; i < list.length; i++) if (list[i].match_id === key) return list[i];
    var h = row.getAttribute("data-live-home");
    var a = row.getAttribute("data-live-away");
    if (h && a) for (var j = 0; j < list.length; j++)
      if (nameHit(list[j].home, h) && nameHit(list[j].away, a)) return list[j];
    return null;
  }
  function pollDate(date, group) {
    fetchLive(date, true).then(function (d) {
      if (!d || !d.matches) return;
      group.forEach(function (row) {
        var m = findMatch(d.matches, row);
        if (!m) return;
        var v = row.querySelector(".ml-v");
        if (v && m.score) v.textContent = m.score;
        var st = row.querySelector(".ml-st");
        // 进行中优先显示比赛分钟（比「进行中」更短，不会撑破状态列）
        if (st && m.status) st.textContent = m.minute ? m.minute + "'" : m.status;
      });
    });
  }
  function visibleDay() {
    var secs = document.querySelectorAll(".ml-sec[data-day]");
    for (var i = 0; i < secs.length; i++) {
      if (secs[i].offsetParent !== null) return secs[i].getAttribute("data-day");
    }
    return "";
  }
  function pollList() {
    // 当前显示的日期优先刷新（原来按 DOM 顺序轮转，今天排第 7 要等 6 分钟才轮到）
    var d = visibleDay();
    if (d && byDate[d]) { pollDate(d, byDate[d]); return; }
    var ds = Object.keys(byDate);
    if (!ds.length) return;
    pollDate(ds[0], byDate[ds[0]]);
  }
  // 切换日期立即拉该日期，不等下一轮
  [].slice.call(document.querySelectorAll('input[name="mlday"]')).forEach(function (inp) {
    inp.addEventListener("change", function () {
      if (!inp.checked) return;
      var d = inp.id.slice(4);
      if (byDate[d]) pollDate(d, byDate[d]);
    });
  });
  loop(pollList);
})();
</script>
