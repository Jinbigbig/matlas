        + (r.lg ? '<span class="odds-lg">' + r.lg + "</span>" : "")
        + '<span class="odds-vs"><a href="matches/' + r.id + '.html"><b>' + r.h + "</b><i>VS</i><b>" + r.a + "</b></a></span>"
        + (done ? '<span class="odds-res">赛果 ' + r.gh + "-" + r.ga
          + (r.hh !== null && r.hh !== undefined ? " (半 " + r.hh + "-" + r.ha + ")" : "") + "</span>" : "")
        + "</div>";
      // 胜平负
      var w = done ? (r.gh > r.ga ? "胜" : r.gh < r.ga ? "负" : "平") : null;
      var s = pill("胜", of.spf && of.spf["胜"], w === "胜", "s-h")
        + pill("平", of.spf && of.spf["平"], w === "平", "s-d")
        + pill("负", of.spf && of.spf["负"], w === "负", "s-a");
      html += '<section class="odds-match">' + head + sec("胜平负", s);
      // 让球（多行；走水行不高亮）
      var rq = "";
      (of.rq || []).forEach(function (row) {
        var line = parseFloat(row.handicap), rw = null;
        if (done && line === line) {
          var adj = r.gh + line;
          rw = adj > r.ga ? "胜" : adj < r.ga ? "负" : "平";
        }
        rq += '<span class="rq-tag">让球' + row.handicap + "</span>"
          + pill("胜", row["胜"], rw === "胜", "s-h")
          + pill("平", row["平"], rw === "平", "s-d")
          + pill("负", row["负"], rw === "负", "s-a");
      });
      html += sec("让球", rq);
      // 比分：胜比分 / 平比分 / 负比分 三组分行（网易布局）
      function scoreGroup(k) {
        var mm = k.match(/^(\d+):(\d+)$/);
        if (mm) { var x = +mm[1], y = +mm[2]; return x > y ? "h" : x < y ? "a" : "d"; }
        return k.indexOf("胜") >= 0 ? "h" : k.indexOf("平") >= 0 ? "d" : k.indexOf("负") >= 0 ? "a" : "d";
      }
      var scG = {h: [], d: [], a: []};
      Object.keys(of.score || {}).forEach(function (k) {
        if (of.score[k]) scG[scoreGroup(k)].push(k);
      });
      var scT = {h: "胜比分", d: "平比分", a: "负比分"};
      ["h", "d", "a"].forEach(function (gk) {
        var s = "";
        scG[gk].forEach(function (k) {
          var v = of.score[k], hit = false, cls = gk === "h" ? "s-h" : gk === "a" ? "s-a" : "s-d";
          var mm = k.match(/^(\d+):(\d+)$/);
          if (mm) hit = done && r.gh === +mm[1] && r.ga === +mm[2];
          s += pill(k, v, hit, cls);
        });
        if (s) html += sec(scT[gk], s);
      });
      // 总进球
      var gl = "", tg = done ? r.gh + r.ga : null;
      Object.keys(of.goals || {}).forEach(function (k) {
        var hit = false;
        if (tg !== null) hit = k === "7+" ? tg >= 7 : +k === tg;
        gl += pill(k, of.goals[k], hit, "");
      });
      html += sec("总进球", gl);
      // 半全场（胜胜…负负）
      var ht = "", hr = done ? (r.hh > r.ha ? "胜" : r.hh < r.ha ? "负" : "平") : null;
      var fr = done ? w : null;
      Object.keys(of.htft || {}).forEach(function (k) {
        ht += pill(k, of.htft[k], done && k === hr + fr, "");
      });
      html += sec("半全场", ht) + "</section>";
    });
    out.innerHTML = html || '<p class="sub">当日无盘口数据。</p>';
  }
  window.renderOddsDay = render; // 日历控件 change 时由全局 JS 调用
  render(DATA.dates[0]);
})();
</script>

<script>
(function () {
  var btn = document.getElementById("back-top");
  if (!btn) return;
  var sync = function () {
    btn.classList.toggle("show", window.scrollY > 480);
  };
  window.addEventListener("scroll", sync, { passive: true });
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  sync();
})();
// data-goto 事件委托：联赛/球队内链在整卡 <a> 内部（HTML 不允许嵌套 a），
// 点击时阻止整卡默认跳转，改跳联赛/球队专题页。
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-goto]");
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  window.location.href = t.getAttribute("data-goto");
});
// 日历日期选择（input[type=date]）：无数据的日期自动吸附到最近的有数据日期
function snapDate(arr, v) {
  if (arr.indexOf(v) >= 0) return v;
  var prev = null, next = null;
  arr.forEach(function (d) {
    if (d < v && (prev === null || d > prev)) prev = d;
    if (d > v && (next === null || d < next)) next = d;
  });
  return prev || next || v;
}
document.addEventListener("change", function (e) {
  var c = e.target.closest(".date-cal");
  if (!c || !c.value) return;
  var dattr = c.getAttribute("data-dates");
  if (!dattr) return;
  var dates = JSON.parse(dattr);
  var t = snapDate(dates, c.value);
  c.value = t;
  var mode = c.getAttribute("data-mode");
  if (mode === "jump") {
    window.location.href = (c.getAttribute("data-pre") || "") + "days/" + t + ".html";
  } else if (mode === "ai") {
    var r = document.getElementById("aid-" + dates.indexOf(t));
    if (r) r.checked = true;
    aiSyncArrows();
  } else if (mode === "odds") {
    if (window.renderOddsDay) window.renderOddsDay(t);
  }
  // mode === "bets"：仅存值，点「加载比赛」时读取
});
// AI 预测卡 ‹› 箭头：基于隐藏 radio 序号步进，内容显隐仍走纯 CSS 规则
function aiSyncArrows() {
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  if (!radios.length) return;
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  document.querySelectorAll("[data-aid-step]").forEach(function (a) {
    var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
    a.classList.toggle("off", i < 0 || i >= radios.length);
  });
}
document.addEventListener("click", function (e) {
  var a = e.target.closest("[data-aid-step]");
  if (!a) return;
  e.preventDefault();
  var radios = document.querySelectorAll('#ai-pred-card input[name="aid"]');
  var cur = -1;
  radios.forEach(function (r, i) { if (r.checked) cur = i; });
  var i = cur + parseInt(a.getAttribute("data-aid-step"), 10);
  if (i >= 0 && i < radios.length) radios[i].checked = true;
  aiSyncArrows();
});
document.addEventListener("change", function (e) {
  if (e.target && e.target.name === "aid") aiSyncArrows();
});
aiSyncArrows();
</script>
