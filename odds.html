<script>
(function () {
  var btn = document.getElementById("back-top");
  if (!btn) return;
  var sync = function () {
    btn.classList.toggle("show", window.scrollY > 480);
  };
  window.addEventListener("scroll", sync, { passive: true });
  btn.addEventListener("click", function (e) {
    e.preventDefault();
    window.scrollTo({ top: 0, behavior: "smooth" });
  });
  sync();
})();
// data-goto 事件委托：联赛/球队内链在整卡 <a> 内部（HTML 不允许嵌套 a），
// 点击时阻止整卡默认跳转，改跳联赛/球队专题页。
document.addEventListener("click", function (e) {
  var t = e.target.closest("[data-goto]");
  if (!t) return;
  e.preventDefault();
  e.stopPropagation();
  window.location.href = t.getAttribute("data-goto");
});
// 时间行日期条：把当前日期水平滚进可视区（历史页 active 排在列表深处）
document.querySelectorAll(".fp-scroll a.fp-opt.active").forEach(function (el) {
  el.scrollIntoView({ inline: "center", block: "nearest" });
});
</script>
