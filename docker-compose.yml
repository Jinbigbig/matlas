services:
  postgres:
    image: postgres:16-alpine
    container_name: matlas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-matlas}
      POSTGRES_USER: ${PG_USER:-matlas}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-matlas}
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-matlas} -d ${PG_DATABASE:-matlas}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: matlas-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MATLAS_PG_DSN: postgresql://${PG_USER:-matlas}:${PG_PASSWORD:-matlas}@postgres:5432/${PG_DATABASE:-matlas}
      PYTHONIOENCODING: utf-8
    volumes:
      - ${MATLAS_ROOT:-.}:/app
    ports:
      - "127.0.0.1:8787:8787"
    command: python live_server.py --bind 0.0.0.0 --port 8787

  collector:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: matlas-collector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MATLAS_PG_DSN: postgresql://${PG_USER:-matlas}:${PG_PASSWORD:-matlas}@postgres:5432/${PG_DATABASE:-matlas}
      MATLAS_SYNC_AFTER_RUN: "1"
      MATLAS_SKIP_LOCK: "1"
      PYTHONIOENCODING: utf-8
    volumes:
      - ${MATLAS_ROOT:-.}:/app
    command: python cloud_collector.py

  nginx:
    image: nginx:1.27-alpine
    container_name: matlas-nginx
    restart: unless-stopped
    depends_on:
      - api
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ${MATLAS_ROOT:-.}/_site:/usr/share/nginx/html:ro
    ports:
      - "8788:80"

volumes:
  pgdata:
